[project]
name = "accuscan"
version = "2.0.0"
description = "Handwriting recognition pipeline: synthetic and GNHK data, a CRNN trained with CTC, evaluation and ONNX export for the browser demo."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Shashank Yadav" }]
dependencies = [
    "fonttools>=4.67.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxscript>=0.7.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "scikit-image>=0.26.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# Only `accuscan baseline` needs these; CI does not install them.
baseline = [
    "sentencepiece>=0.2.2",
    "transformers>=5.20.1",
]

[project.scripts]
accuscan = "accuscan.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-tqdm>=4.70.0.20260906",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.14"]
build-backend = "uv_build"

# CPU-only torch on Linux keeps CI installs small; macOS wheels are CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "PTH", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "skimage.*", "fontTools.*", "onnxruntime.*", "onnx.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers is an optional extra; when it is installed its methods are unannotated.
module = ["accuscan.baseline"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
